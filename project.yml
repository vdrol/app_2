# Optional: regenerate Roundtable.xcodeproj with XcodeGen (`brew install xcodegen && xcodegen`)
# if the checked-in project ever fails to open on your Xcode version.
name: Roundtable
options:
  bundleIdPrefix: com.vdrol
  deploymentTarget:
    iOS: "17.0"
targets:
  Roundtable:
    type: application
    platform: iOS
    sources: [Roundtable]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Roundtable
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Roundtable listens to the conversation around you to show live captions. Audio is processed on this iPhone and never recorded or uploaded.
        NSSpeechRecognitionUsageDescription: Roundtable turns speech into captions using on-device speech recognition.
        NSLocalNetworkUsageDescription: Roundtable shares captions with nearby phones at your table over Wi-Fi and Bluetooth, without using the internet.
        NSBonjourServices: [_tablecaptions._tcp, _tablecaptions._udp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vdrol.Roundtable
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
